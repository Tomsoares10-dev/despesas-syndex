<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despesas de viagem – Syndex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Despesas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#003366">
<script>try{var t=localStorage.getItem('syndex-tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#003366; --bg:#E9EEF3; --surface:#FFFFFF; --surface-2:#F3F6F9; --ink:#0F1E2E; --muted:#58697B;
  --line:#D3DCE5; --accent:#003366; --accent-soft:#DDE8F3; --primary:#003366; --primary-ink:#FFFFFF;
  --green:#2F8F4A; --green-soft:#E3F2E7; --danger:#B42318; --danger-soft:#FDECEA; --tape:#003366; --tape-ink:#FFFFFF;
  --focus:#2F7DD1; --scrim:rgba(6,18,30,.48);
  --f-ui:'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --f-num:'Barlow Semi Condensed', 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1520; --surface:#12212E; --surface-2:#182A3A; --ink:#E6EDF3; --muted:#93A5B7; --line:#24384A;
    --accent:#8DBDF0; --accent-soft:#1B3550; --primary:#5B9BE0; --primary-ink:#04111D;
    --green:#5CCB7B; --green-soft:#16301F; --danger:#F7857A; --danger-soft:#3A1A18; --tape:#0D2C4D; --tape-ink:#FFFFFF;
    --focus:#8DBDF0; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1520; --surface:#12212E; --surface-2:#182A3A; --ink:#E6EDF3; --muted:#93A5B7; --line:#24384A;
  --accent:#8DBDF0; --accent-soft:#1B3550; --primary:#5B9BE0; --primary-ink:#04111D;
  --green:#5CCB7B; --green-soft:#16301F; --danger:#F7857A; --danger-soft:#3A1A18; --tape:#0D2C4D; --tape-ink:#FFFFFF;
  --focus:#8DBDF0; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--f-ui);
  font-size:16px; line-height:1.45; -webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
img{max-width:100%}
.num{font-family:var(--f-num); font-variant-numeric:tabular-nums}

/* Topo */
.top{max-width:560px; margin:0 auto; padding:14px 16px 10px; display:flex; align-items:center; gap:12px}
.logo{flex:none; background:#fff; border-radius:10px; padding:5px 8px; display:flex; box-shadow:0 0 0 1px var(--line)}
.logo img{height:26px; width:auto; display:block}
.top-t{flex:1; min-width:0}
.top h1{margin:0; font-size:17px; font-weight:600; line-height:1.2}
.status{margin:1px 0 0; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px}
.status::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted)}
.status[data-s="cloud"]::before{background:var(--green)}
.status[data-s="saving"]::before{background:var(--accent)}
.icon-btn{flex:none; display:flex; align-items:center; gap:6px; height:40px; padding:0 12px; border-radius:12px;
  border:1px solid var(--line); background:var(--surface); font-size:15px; font-weight:500}

.wrap{max-width:560px; margin:0 auto; padding:4px 16px calc(112px + env(safe-area-inset-bottom,0px))}

/* Fita do total (o recibo) */
.tape{background:var(--tape); color:var(--tape-ink); border-radius:18px 18px 4px 4px; padding:16px 18px 22px; margin:4px 0 22px;
  -webkit-mask:radial-gradient(circle at 8px 100%, transparent 5px, #000 5.5px) 0 0/16px 100% repeat-x;
  mask:radial-gradient(circle at 8px 100%, transparent 5px, #000 5.5px) 0 0/16px 100% repeat-x}
.tape-l{margin:0; font-size:14px; opacity:.82}
.tape-v{margin:2px 0 4px; font-family:var(--f-num); font-weight:600; font-size:44px; line-height:1.05; letter-spacing:-.5px; font-variant-numeric:tabular-nums}
.tape-s{margin:0; font-size:14.5px; opacity:.9}

.sec{font-family:var(--f-num); font-size:19px; font-weight:600; margin:0 0 10px; letter-spacing:.1px}

/* Categorias */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:26px}
.tile{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left;
  min-height:96px; padding:13px 13px 12px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  transition:transform .12s ease, background-color .12s ease}
.tile:active{transform:scale(.97); background:var(--surface-2)}
.tile svg{color:var(--accent)}
.tile-n{font-weight:600; font-size:15.5px; line-height:1.2}
.tile-d{font-size:13px; color:var(--muted); line-height:1.25; margin-top:-3px}
.plate{position:absolute; top:10px; right:10px; font-family:var(--f-num); font-size:12px; font-weight:600; color:var(--muted);
  border:1px solid var(--line); border-radius:6px; padding:0 5px; line-height:18px}

/* Lista */
.day{margin:0 0 16px}
.day-h{display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted); margin:0 2px 6px}
.day-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.item{display:grid; grid-template-columns:36px 1fr auto; align-items:center; gap:12px; width:100%; padding:11px 14px;
  border:0; border-top:1px solid var(--line); background:transparent; text-align:left}
.item:first-child{border-top:0}
.item:active{background:var(--surface-2)}
.item-ico{width:36px; height:36px; border-radius:10px; background:var(--accent-soft); color:var(--accent); display:grid; place-items:center}
.item-txt{min-width:0; display:flex; flex-direction:column}
.item-cat{font-weight:600; font-size:15px; line-height:1.25}
.item-desc{font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item-val{text-align:right; display:flex; flex-direction:column}
.item-amt{font-family:var(--f-num); font-weight:600; font-size:17px; font-variant-numeric:tabular-nums}
.item-sub{font-size:12.5px; color:var(--muted)}
.empty{border:1.5px dashed var(--line); border-radius:14px; padding:18px; color:var(--muted); font-size:15px; margin:0}

/* Barra fixa */
.bar{position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--bg); border-top:1px solid var(--line); z-index:20}
.bar .primary{max-width:528px; margin:0 auto; display:block}
.primary{width:100%; min-height:52px; border:0; border-radius:14px; background:var(--primary); color:var(--primary-ink);
  font-size:17px; font-weight:600; padding:0 16px}
.primary:disabled{opacity:.45; cursor:not-allowed}
.secondary{width:100%; min-height:48px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
  font-size:16px; font-weight:500}
.link-danger{border:0; background:none; color:var(--danger); font-weight:500; padding:10px 4px; font-size:15px}

.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,12px);
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:15px; font-weight:500;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:30; max-width:calc(100% - 32px); text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* Folha (bottom sheet) */
.sheet-wrap{position:fixed; inset:0; z-index:40; background:var(--scrim); opacity:0; transition:opacity .2s}
.sheet-wrap.open{opacity:1}
.sheet{position:absolute; left:0; right:0; bottom:var(--kb,0px); margin:0 auto; max-width:560px;
  max-height:calc(100% - var(--kb,0px) - env(safe-area-inset-top,0px) - 12px); overflow:auto; overscroll-behavior:contain;
  background:var(--surface); border-radius:20px 20px 0 0; padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));
  transform:translateY(24px); transition:transform .22s ease}
.sheet-wrap.open .sheet{transform:none}
.sheet:focus{outline:none}
.grab{width:40px; height:4px; border-radius:2px; background:var(--line); margin:4px auto 10px}
.sh-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.sh-head .item-ico{width:42px; height:42px; border-radius:12px}
.sh-head h2{margin:0; font-size:19px; font-weight:600; line-height:1.2}
.sh-head p{margin:1px 0 0; font-size:13.5px; color:var(--muted)}
.sh-x{margin-left:auto; flex:none; width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface);
  display:grid; place-items:center}

.big{display:block; margin:0 0 6px}
.big-l{display:block; font-size:14px; color:var(--muted); margin-bottom:2px}
.big-row{display:flex; align-items:baseline; gap:8px; border-bottom:2px solid var(--accent); padding-bottom:2px}
.big-row span{font-family:var(--f-num); font-size:22px; font-weight:600; color:var(--muted)}
.big input{flex:1; min-width:0; border:0; background:transparent; outline:none; padding:0;
  font-family:var(--f-num); font-size:42px; font-weight:600; font-variant-numeric:tabular-nums}
.big input::placeholder{color:var(--line)}
.big-row:focus-within{border-bottom-color:var(--focus)}
.calc{margin:6px 0 0; font-size:15px; color:var(--muted)}
.calc b{color:var(--ink); font-family:var(--f-num); font-size:17px}

.field{display:block; margin:16px 0 0}
.field > span, .f-l{display:block; font-size:14px; color:var(--muted); margin-bottom:6px}
.field input, .field textarea, .field select{width:100%; min-height:46px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface-2); padding:10px 12px; font-size:16px}
.field textarea{min-height:76px; resize:vertical}
.chips{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.chip{height:38px; padding:0 14px; border-radius:19px; border:1px solid var(--line); background:var(--surface); font-size:15px; font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.chips input[type="date"]{flex:1; min-width:150px; width:auto; min-height:38px; height:38px; border-radius:19px; padding:0 12px}
.recent{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.recent .chip{height:32px; font-size:13.5px; padding:0 11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:400}
.err{min-height:20px; margin:10px 0 6px; color:var(--danger); font-size:14.5px}
.msg{margin:10px 0 0; font-size:14.5px}
.msg.ok{color:var(--green)} .msg.err{color:var(--danger)}
.actions{display:flex; justify-content:center; margin-top:6px}
.confirm{background:var(--danger-soft); border-radius:14px; padding:12px 14px; margin-top:10px}
.confirm p{margin:0 0 10px; font-size:15px}
.confirm .row{display:flex; gap:8px}
.btn-danger{flex:1; min-height:44px; border:0; border-radius:12px; background:var(--danger); color:#fff; font-weight:600; font-size:15.5px}
.btn-plain{flex:1; min-height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:500; font-size:15.5px}

.resumo{margin:14px 0 0; border:1px solid var(--line); border-radius:14px; overflow:hidden}
.res-row{display:flex; justify-content:space-between; gap:12px; padding:9px 14px; border-top:1px solid var(--line); font-size:15px}
.res-row:first-child{border-top:0}
.res-row .num{font-weight:600}
.res-row.muted{color:var(--muted)}
.res-row.strong{background:var(--surface-2); font-weight:600}
.res-row.saldo{background:var(--green-soft); color:var(--green); font-weight:600}
.res-row.saldo.neg{background:var(--danger-soft); color:var(--danger)}
.note{font-size:13.5px; color:var(--muted); margin:8px 0 0}
.gap{height:14px}

/* Foto da nota */
.vh{position:absolute; left:-9999px; width:1px; height:1px; opacity:0; overflow:hidden; pointer-events:none}
.foto-cta{margin:0 0 4px}
.cta{width:100%; display:flex; align-items:center; gap:14px; text-align:left; padding:14px 16px; min-height:78px;
  border-radius:16px; border:1.5px solid var(--accent); background:var(--surface); transition:transform .12s ease}
.cta:active{transform:scale(.985)}
.cta-ico{flex:none; width:48px; height:48px; border-radius:13px; display:grid; place-items:center; background:var(--primary); color:var(--primary-ink)}
.cta-t{display:flex; flex-direction:column; min-width:0}
.cta-t b{font-size:18px; font-weight:600; line-height:1.2}
.cta-t span{font-size:14px; color:var(--muted)}
.link{border:0; background:none; color:var(--accent); font-weight:500; font-size:15px; padding:10px 2px;
  text-decoration:underline; text-underline-offset:3px}
.foto-cta .link{display:block; margin:2px 0 0 auto}
.sub-l{font-size:14px; color:var(--muted); margin:4px 0 8px}
.foto{display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--line); border-radius:14px;
  background:var(--surface-2); margin:0 0 14px}
.foto-thumb{flex:none; width:52px; height:64px; padding:0; border:0; border-radius:8px; overflow:hidden; background:var(--line)}
.foto-thumb img{width:100%; height:100%; object-fit:cover; display:block}
.foto-txt{flex:1; min-width:0; display:flex; flex-direction:column; font-size:14px; line-height:1.3}
.foto-txt b{font-weight:600; font-size:15px}
.foto-txt span{color:var(--muted)}
.foto-acts{display:flex; gap:6px}
.mini{height:34px; padding:0 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-size:14px; font-weight:500}
.foto-big{margin:-4px 0 14px}
.foto-big img{width:100%; border-radius:12px; display:block}
.anexar{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; width:100%; min-height:44px;
  border:1.5px dashed var(--line); background:transparent; border-radius:12px; color:var(--accent); font-weight:500; font-size:15px}
.callout{margin:0 0 12px; padding:10px 12px; border-radius:12px; background:var(--green-soft); color:var(--green); font-size:14.5px; font-weight:500}
.callout.warn{background:var(--danger-soft); color:var(--danger)}
.lendo{position:relative; margin:4px auto 12px; width:min(230px,66%); border-radius:12px; overflow:hidden; background:var(--surface-2)}
.lendo img{display:block; width:100%; max-height:44vh; object-fit:contain}
.scan{position:absolute; left:0; right:0; top:0; height:3px; background:var(--accent); box-shadow:0 0 14px var(--accent);
  animation:scan 1.5s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
.center{text-align:center}
.secondary svg{vertical-align:-3px; margin-right:6px}

@media (min-width:600px){
  .sheet{border-radius:20px; bottom:calc(var(--kb,0px) + 24px)}
  .tape-v{font-size:52px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none !important; animation:none !important}
}
/* Tela única */
.tape{background:var(--surface); color:var(--ink); padding:14px 18px 20px; margin:4px 0 14px}
.tape-l{color:var(--muted); opacity:1}
.tape-v{font-size:38px; color:var(--accent)}
.tape-s{color:var(--muted); opacity:1}
.cam{width:100%; min-height:200px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  border:0; border-radius:24px; background:var(--primary); color:var(--primary-ink); padding:20px; text-align:center;
  box-shadow:0 12px 26px -16px rgba(0,51,102,.7); transition:transform .12s ease}
.cam:active{transform:scale(.98)}
.cam-ico{width:78px; height:78px; border-radius:50%; display:grid; place-items:center; margin-bottom:6px;
  background:rgba(255,255,255,.14); background:color-mix(in srgb, currentColor 16%, transparent)}
.cam b{font-size:23px; font-weight:700; letter-spacing:.1px; line-height:1.15}
.cam-sub{font-size:15px; opacity:.85}
.gal{display:block; margin:4px auto 2px}
.alt-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:4px 0 24px}
.alt{display:flex; align-items:center; justify-content:center; gap:8px; min-height:54px; border-radius:14px;
  border:1px solid var(--line); background:var(--surface); font-size:16px; font-weight:600; transition:transform .12s ease}
.alt:active{transform:scale(.97)}
.alt span{display:grid; color:var(--accent)}
.conf-top{display:flex; align-items:center; gap:14px}
.conf-top .big{flex:1; min-width:0; margin:0}
.conf-top .foto-thumb{width:64px; height:82px}
.foto-big{margin:12px 0 0}
.resumo-linha{display:flex; align-items:center; gap:10px; margin:14px 0 0; padding:10px 12px; border-radius:12px; background:var(--surface-2)}
.resumo-linha div{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3}
.resumo-linha b{font-size:15.5px; font-weight:600}
.resumo-linha span{font-size:14px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.foto-linha{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; font-size:14px; color:var(--muted)}
.links{display:flex; flex-direction:column; align-items:center; gap:0}
.links .confirm{align-self:stretch}
/* Categorias em evidência, foto da nota, assinatura e histórico */
.tile .plate{font-size:13px; color:var(--accent); border-color:var(--accent)}
.tiles{margin-bottom:24px}
.catgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.catbtn{display:flex; align-items:center; gap:8px; min-height:50px; padding:8px 10px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface); text-align:left; font-size:14px; font-weight:500; line-height:1.2}
.catbtn .cc{flex:none; font-family:var(--f-num); font-weight:700; font-size:13.5px; color:var(--muted); min-width:32px}
.catbtn[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.catbtn[aria-pressed="true"] .cc{color:var(--accent)}
.row2{display:flex; gap:8px}
.foto-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; border-radius:12px;
  border:1.5px dashed var(--accent); background:transparent; color:var(--accent); font-weight:600; font-size:15.5px}
.foto-btn.sec{flex:0 0 auto; padding:0 18px; border-style:solid; border-color:var(--line); color:var(--ink); font-weight:500}
.field .foto{margin:0}
.ass{margin-top:16px}
.pad{position:relative; height:150px; background:#fff; border:1.5px dashed #A9B7C6; border-radius:14px; overflow:hidden}
.pad canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:crosshair}
.pad-ph{position:absolute; left:0; right:0; top:38%; text-align:center; color:#8A99A8; font-size:15px; pointer-events:none}
.pad-line{position:absolute; left:18px; right:18px; bottom:34px; border-top:1px solid #C9D3DD; pointer-events:none}
.ass-img{background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; display:flex; justify-content:center}
.ass-img img{max-height:90px; max-width:100%}
.btn-ok{flex:1; min-height:44px; border:0; border-radius:12px; background:var(--primary); color:var(--primary-ink); font-weight:600; font-size:15.5px}
.btn-ok:disabled{opacity:.45}
.hist{display:flex; flex-direction:column; gap:8px}
.hist-ano{font-size:13.5px; color:var(--muted); margin:6px 2px 6px; font-weight:600}
.hist-item{display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--line);
  background:var(--surface); text-align:left}
.hist-item:active{background:var(--surface-2)}
.hist-item .t{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3}
.hist-item .t b{font-size:15.5px; font-weight:600}
.hist-item .t span{font-size:13.5px; color:var(--muted)}
.hist-item .v{font-family:var(--f-num); font-weight:600; font-size:17px; font-variant-numeric:tabular-nums}
.sheet .day{margin-bottom:12px}
.adi{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
.adi-row{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14.5px; color:var(--muted)}
.adi-row b{font-family:var(--f-num); font-size:17px; font-weight:600; color:var(--ink); margin-left:4px}
.adi-m{color:var(--muted)}
.adi-b{flex:none; display:flex; align-items:center; gap:6px; height:34px; padding:0 12px; border-radius:10px; border:1px solid var(--accent);
  background:transparent; color:var(--accent); font-weight:600; font-size:14px}
.adi-bar{height:6px; border-radius:3px; background:var(--surface-2); margin:9px 0 6px; overflow:hidden}
.adi-bar span{display:block; height:100%; background:var(--accent); border-radius:3px}
.adi-s{margin:0; font-size:14px; color:var(--muted)}
.adi-s b{color:var(--ink); font-family:var(--f-num); font-size:16px}
.pronto{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--surface); border-top:1px solid var(--line);
  box-shadow:0 -10px 30px -12px rgba(6,18,30,.35); padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.pronto-in{max-width:528px; margin:0 auto; display:flex; flex-direction:column; gap:10px}
.pronto-t{display:flex; align-items:flex-start; gap:10px}
.pronto-t div{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3}
.pronto-t b{font-size:16px; font-weight:600}
.pronto-t span{font-size:13.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pronto .link{align-self:center; padding:4px 2px}
#sec-aprov{margin:0 0 24px}
.primary svg{vertical-align:-3px}
.item-ico.ok{background:var(--green-soft); color:var(--green)}
.item-ico.dev{background:var(--danger-soft); color:var(--danger)}
#btn-dados{padding:0 11px}
@media (max-width:440px){ #btn-hist{padding:0 11px} #btn-hist span{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)} .top{gap:10px} }
</style>
</head>

function zipStore(files) {
  var enc = new TextEncoder();
  var table = zipStore._t;
  if (!table) {
    table = zipStore._t = new Uint32Array(256);
    for (var i = 0; i < 256; i++) {
      var c = i;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[i] = c >>> 0;
    }
  }
  var crc32 = function (b) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < b.length; i++) c = table[(c ^ b[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  };
  var parts = [], central = [], offset = 0;
  files.forEach(function (f) {
    var name = enc.encode(f.name), size = f.data.length, crc = crc32(f.data);
    var lh = new Uint8Array(30 + name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
    dv.setUint16(26, name.length, true); dv.setUint16(28, 0, true); lh.set(name, 30);
    parts.push(lh, f.data);
    var ch = new Uint8Array(46 + name.length), cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true); cv.setUint32(16, crc, true); cv.setUint32(20, size, true);
    cv.setUint32(24, size, true); cv.setUint16(28, name.length, true); cv.setUint32(42, offset, true);
    ch.set(name, 46);
    central.push(ch);
    offset += lh.length + size;
  });
  var cdSize = central.reduce(function (a, b) { return a + b.length; }, 0);
  var end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
  var all = parts.concat(central, [end]);
  var total = all.reduce(function (a, b) { return a + b.length; }, 0);
  var out = new Uint8Array(total), p = 0;
  all.forEach(function (b) { out.set(b, p); p += b.length; });

/* Números do relatório, usados pelo Excel e pelo PDF (mesma conta nos dois). */
function resumoRelatorio(rep) {
  var r2 = function (x) { return Math.round((Number(x) || 0) * 100) / 100; };
  var BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var NUM = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 2 });
  var L = rep.linhas || [];
  var res = { total: 0, km: 0, cats: [], n: L.length, dias: 0, semKm: 0, comNota: 0 };
  var porCode = {}, dias = {};
  L.forEach(function (l) {
    var v = r2(l.valor);
    res.total = r2(res.total + v);
    if (!porCode[l.code]) {
      porCode[l.code] = { code: l.code, nome: l.nome, cor: l.cor, n: 0, v: 0 };
      res.cats.push(porCode[l.code]);
    }
    porCode[l.code].n++;
    porCode[l.code].v = r2(porCode[l.code].v + v);
    if (l.km) res.km = r2(res.km + (Number(l.qtd) || 0));
    else { res.semKm++; if (l.nota) res.comNota++; }
    dias[l.data] = 1;
  });
  res.dias = Object.keys(dias).length;
  res.cats.sort(function (a, b) { return b.v - a.v || (a.code < b.code ? -1 : 1); });
  res.adi = r2(rep.adiantamento);
  res.saldo = r2(res.total - res.adi);
  var conf = [];
  if (res.semKm) {
    var falta = res.semKm - res.comNota;
    conf.push({ ok: !falta, t: res.comNota + ' de ' + res.semKm + (res.semKm === 1 ? ' nota anexada' : ' notas anexadas') +
      (falta ? ' (falta' + (falta > 1 ? 'm ' : ' ') + falta + ')' : '') });
  }
  conf.push({ ok: true, t: res.n + (res.n === 1 ? ' despesa' : ' despesas') + ' em ' + res.dias + (res.dias === 1 ? ' dia' : ' dias') });
  if (res.km) conf.push({ ok: true, t: NUM.format(res.km) + ' km a ' + BRL.format(r2(rep.valorKm)) + ' por km' });
  res.conf = conf;
  res.tudoOk = conf.every(function (c) { return c.ok; });
  return res;
}

  // ---------------- Assinatura com o dedo ----------------
  function montarPad(canvas, onChange) {
    var dpr = window.devicePixelRatio || 1, ctx = null, desenhando = false, ult = null, lim = null, tem = false;
    var cor = '#0B1F33';
    function medir() {
      var r = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(r.width * dpr));
      canvas.height = Math.max(1, Math.round(r.height * dpr));
      ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 2.6; ctx.strokeStyle = cor; ctx.fillStyle = cor;
    }
    medir();
    function pt(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function cresce(p) {
      if (!lim) lim = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
      else { lim.x0 = Math.min(lim.x0, p.x); lim.y0 = Math.min(lim.y0, p.y); lim.x1 = Math.max(lim.x1, p.x); lim.y1 = Math.max(lim.y1, p.y); }
    }
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      try { canvas.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
      desenhando = true; ult = pt(e); cresce(ult);
      ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.3, 0, Math.PI * 2); ctx.fill();
      if (!tem) { tem = true; onChange(true); }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!desenhando) return;
      e.preventDefault();
      var p = pt(e);
      ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      ult = p; cresce(p);
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) {
      canvas.addEventListener(ev, function () { desenhando = false; });
    });
    return {
      vazio: function () { return !tem; },
      limpar: function () { ctx.clearRect(0, 0, canvas.width, canvas.height); tem = false; lim = null; onChange(false); },
      exportar: function () {
        if (!tem || !lim) return null;
        var m = 10;
        var x0 = Math.max(0, lim.x0 - m), y0 = Math.max(0, lim.y0 - m);
        var x1 = Math.min(canvas.width / dpr, lim.x1 + m), y1 = Math.min(canvas.height / dpr, lim.y1 + m);
        var sw = (x1 - x0) * dpr, sh = (y1 - y0) * dpr;
        var k = Math.min(1, 600 / sw, 200 / sh);
        var out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(sw * k)); out.height = Math.max(1, Math.round(sh * k));
        out.getContext('2d').drawImage(canvas, x0 * dpr, y0 * dpr, sw, sh, 0, 0, out.width, out.height);
        return out.toDataURL('image/png');
      }
    };
  }

  async function fecharViagem() {
    var r = resumo(), c = state.config;
    var t = {
      v: 1, id: 'v' + uid(), inicio: r.inicio, fim: r.fim, fechado: isoHoje(), dataEnvio: isoHoje(),
      total: r.total, km: r.km, n: r.lin.length,
      config: { nome: c.nome, departamento: c.departamento, autorizado: c.autorizado, valorKm: c.valorKm,
        adiantamento: c.adiantamento || 0, observacoes: c.observacoes || '' },
      assinatura: c.assinatura || null,
      despesas: JSON.parse(JSON.stringify(state.despesas))
    };
    try {
      if (histRef) {
        await histRef.doc(t.id).set(t);
      } else {
        var lista = [t].concat(lerHistLocal());
        localStorage.setItem(LS_HIST, JSON.stringify(lista));
        usarHistLocal();
      }
    } catch (e) {
      return false;
    }
    commit(function (s) { s.despesas = []; s.config.adiantamento = 0; s.config.observacoes = ''; });
    return true;
  }

  function renderHistLista(el) {
    if (!histCarregado) { el.innerHTML = '<p class="note center">Carregando…</p>'; return; }
    if (!historico.length) {
      el.innerHTML = '<p class="empty">Nenhuma viagem guardada ainda. Ao gerar o relatório, toque em “Fechar viagem e guardar no histórico”.</p>';
      return;
    }
    var porAno = {};
    historico.forEach(function (t) { (porAno[t.inicio.slice(0, 4)] = porAno[t.inicio.slice(0, 4)] || []).push(t); });
    el.innerHTML = Object.keys(porAno).sort().reverse().map(function (ano) {
      return '<p class="hist-ano">' + ano + '</p><div class="hist">' + porAno[ano].map(function (t) {
        var n = t.n || t.despesas.length;
        var fotos = t.despesas.filter(function (e) { return e.foto; }).length;
        return '<button class="hist-item" type="button" data-v="' + esc(t.id) + '"><span class="t"><b>' + esc(periodoLongo(t.inicio, t.fim)) + '</b>' +
          '<span>' + n + (n === 1 ? ' lançamento' : ' lançamentos') + (t.km ? ', ' + esc(fmtKm(t.km)) : '') +
          (fotos ? ', ' + fotos + (fotos === 1 ? ' nota' : ' notas') : '') +
          (r2(t.config.adiantamento) ? ', adiantamento ' + esc(fmtBRL(t.config.adiantamento)) : '') + '</span></span>' +
          '<span class="v">' + esc(fmtBRL(t.total)) + '</span></button>';
      }).join('') + '</div>';
    }).join('');
    el.querySelectorAll('.hist-item').forEach(function (b) {
      b.addEventListener('click', function () { abrirViagem(b.dataset.v); });
    });
  }

      '<div class="resumo">' +

      '<p class="msg" id="h-msg" role="status"></p>' +
      '<div class="actions"><button class="link" type="button" id="h-voltar">Voltar ao histórico</button></div>');
    var msg = $('#h-msg');

    $('#h-voltar').addEventListener('click', abrirHistorico);
  }

  function aplicarTema(t) {
    var r = document.documentElement;
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
    var escuro = t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', escuro ? '#0A1520' : '#003366');
    try { if (t === 'light' || t === 'dark') localStorage.setItem('syndex-tema', t); else localStorage.removeItem('syndex-tema'); } catch (e) { /* sem armazenamento */ }
  }

  // ---------------- Aprovação (perfil Aprovador/a) ----------------
  // O PDF do comercial leva dentro dele (metadados) quem é, os valores e a posição da linha "Aprovação".
  // A aprovadora abre o PDF recebido, confere e aprova: a assinatura dela e a data/hora entram na linha
  // "Aprovação" por uma atualização incremental do PDF, sem refazer o que o comercial gerou.
  var aprovLista = [];
  function bytesLatin1(b) {
    var s = '', i;
    for (i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return s;
  }
  function b64Json(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
  function jsonB64(s) { return JSON.parse(decodeURIComponent(escape(atob(s)))); }
  function lerRelatorioPdf(bytes) {
    var s = bytesLatin1(bytes);
    if (s.slice(0, 5) !== '%PDF-') return { erro: 'nao-pdf' };
    var ms = s.match(/\/SyndexRQ \(([A-Za-z0-9+\/=]+)\)/g);
    if (!ms) return { erro: 'sem-dados' };
    var meta;
    try { meta = jsonB64(/\(([^)]+)\)/.exec(ms[ms.length - 1])[1]); } catch (e) { return { erro: 'sem-dados' }; }
    var ap = s.match(/\/SyndexAprovado \(([A-Za-z0-9+\/=]+)\)/), aprovado = null;
    if (ap) { try { aprovado = jsonB64(ap[1]); } catch (e) { aprovado = {}; } }
    return { meta: meta, aprovado: aprovado, s: s };
  }
  function pdfTexto(t) {
    var out = '';
    Array.from(t).forEach(function (ch) {
      var c = ch.charCodeAt(0);
      if (c === 40 || c === 41 || c === 92) out += '\\' + ch;
      else if (c >= 32 && c < 127) out += ch;
      else if (c >= 160 && c < 256) out += '\\' + ('00' + c.toString(8)).slice(-3);
      else out += '?';
    });
    return '(' + out + ')';
  }
  function largTexto(t, size) {
    var soma = 0;
    Array.from(t).forEach(function (ch) { var c = ch.charCodeAt(0); soma += (c >= 32 && c < 256 && PDF_LARG.H[c - 32]) || 556; });
    return soma / 1000 * size;
  }
  // acrescenta ao PDF original: imagem da assinatura, um conteúdo novo na página da "Aprovação" e a marca de aprovado
  function carimbarAprovacao(bytes, lido, ass, quem, quando) {
    var s = lido.s, meta = lido.meta, a = meta.aprov;
    var sx = s.lastIndexOf('startxref');
    var prev = parseInt(s.slice(sx + 9).replace(/^\s+/, ''), 10);
    var size = (s.match(/\/Size (\d+)/g) || []).reduce(function (m, t) { return Math.max(m, parseInt(t.slice(6), 10)); }, 0);
    var root = (s.match(/\/Root (\d+ \d+ R)/g) || []).pop();
    var kids = /\/Type \/Pages \/Kids \[([^\]]*)\]/.exec(s);
    if (!(sx > 0) || !(prev >= 0) || !size || !root || !kids) throw new Error('estrutura');
    var pags = kids[1].match(/\d+(?= 0 R)/g), pn = pags && pags[a.p];
    if (!pn) throw new Error('pagina');
    var re = new RegExp('(?:^|\\n)' + pn + ' 0 obj\\n(<< /Type /Page [^\\n]*>>)\\nendobj', 'g'), m, dict = null;
    while ((m = re.exec(s))) dict = m[1];
    if (!dict) throw new Error('pagina');
    var iN = size, cN = size + 1, fN = size + 2;
    var cm = /\/Contents (\d+ 0 R|\[[^\]]*\])/.exec(dict);
    if (!cm) throw new Error('conteudo');
    var novoC = cm[1].charAt(0) === '[' ? cm[1].slice(0, -1) + ' ' + cN + ' 0 R]' : '[' + cm[1] + ' ' + cN + ' 0 R]';
    dict = dict.replace(cm[0], '/Contents ' + novoC);
    dict = /\/XObject << /.test(dict) ? dict.replace('/XObject << ', '/XObject << /ImAp ' + iN + ' 0 R ')
      : dict.replace('/Resources << ', '/Resources << /XObject << /ImAp ' + iN + ' 0 R >> ');
    var H = 842, f = function (n) { return (Math.round(n * 100) / 100).toString(); };
    var k = Math.min(a.w * 0.8 / ass.w, 58 / ass.h), aw = ass.w * k, ah = ass.h * k, px = a.x + (a.w - aw) / 2;
    var txt = 'Aprovado em ' + quando, ts = 6.8, tw = largTexto(txt, ts);
    var ops = 'q ' + f(aw) + ' 0 0 ' + f(ah) + ' ' + f(px) + ' ' + f(H - a.y + 1) + ' cm /ImAp Do Q\n' +
      '0.420 0.467 0.502 rg BT /F1 ' + f(ts) + ' Tf ' + f(a.x + a.w / 2 - tw / 2) + ' ' + f(H - (a.y + 30.5)) + ' Td ' + pdfTexto(txt) + ' Tj ET';
    var enc = new TextEncoder(), partes = [], pos = bytes.length, offs = {};
    var add = function (x) { if (typeof x === 'string') x = enc.encode(x); partes.push(x); pos += x.length; };
    add('\n');
    offs[iN] = pos;
    add(iN + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + ass.w + ' /Height ' + ass.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + ass.jpeg.length + ' >>\nstream\n');
    add(ass.jpeg); add('\nendstream\nendobj\n');
    var cb = enc.encode(ops);
    offs[cN] = pos;
    add(cN + ' 0 obj\n<< /Length ' + cb.length + ' >>\nstream\n'); add(cb); add('\nendstream\nendobj\n');
    offs[pn] = pos;
    add(pn + ' 0 obj\n' + dict + '\nendobj\n');
    offs[fN] = pos;
    add(fN + ' 0 obj\n<< /Producer (Syndex Despesas de viagem) /SyndexRQ (' + b64Json(meta) + ') /SyndexAprovado (' +
      b64Json({ por: quem, quando: quando }) + ') >>\nendobj\n');
    var xref = pos, lx = function (o) { return ('0000000000' + o).slice(-10) + ' 00000 n \n'; };
    add('xref\n0 1\n0000000000 65535 f \n' + iN + ' 3\n' + lx(offs[iN]) + lx(offs[cN]) + lx(offs[fN]) + pn + ' 1\n' + lx(offs[pn]) +
      'trailer\n<< /Size ' + (size + 3) + ' /Root ' + root.slice(6) + ' /Info ' + fN + ' 0 R /Prev ' + prev + ' >>\nstartxref\n' + xref + '\n%%EOF\n');
    var out = new Uint8Array(pos), o = bytes.length;
    out.set(bytes, 0);
    partes.forEach(function (p) { out.set(p, o); o += p.length; });
    return out;
  }

  // histórico de aprovações (só no celular da aprovadora)
  function idbAprov(modo, fn) {
    return idbAbrir().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('aprov', modo);
        fn(tx.objectStore('aprov'));
        tx.oncomplete = function () { res(); };
        tx.onerror = tx.onabort = function () { rej(tx.error); };
      });
    });
  }
  function carregarAprov() {
    return idbAbrir().then(function (db) {
      return new Promise(function (res) {
        var lista = [], tx = db.transaction('aprov', 'readonly'), cur = tx.objectStore('aprov').openCursor();
        cur.onsuccess = function () { var c = cur.result; if (c) { lista.push(c.value); c.continue(); } };
        tx.oncomplete = function () { res(lista); };
        tx.onerror = function () { res([]); };
      });
    }).catch(function () { return []; });
  }
  function periodoMeta(m) {
    var d = function (x) { return x ? x.split('-').reverse().slice(0, 2).join('/') : ''; };
    return !m.inicio ? '' : m.inicio === m.fim ? d(m.inicio) : d(m.inicio) + ' a ' + d(m.fim);
  }
  function agoraBR() {
    var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function resumoMetaHtml(m) {
    var s = r2((m.total || 0) - (m.adiantamento || 0));
    return '<div class="resumo">' +
      '<div class="res-row"><span>Colaborador</span><span>' + esc(m.nome || '–') + '</span></div>' +
      (m.departamento ? '<div class="res-row muted"><span>Departamento</span><span>' + esc(m.departamento) + '</span></div>' : '') +
      '<div class="res-row muted"><span>Período</span><span>' + esc(periodoMeta(m) || '–') + '</span></div>' +
      '<div class="res-row strong"><span>Total das despesas</span><span class="num">' + fmtBRL(m.total || 0) + '</span></div>' +
      '<div class="res-row muted"><span>(–) Adiantamento</span><span class="num">' + fmtBRL(m.adiantamento || 0) + '</span></div>' +
      '<div class="res-row saldo' + (s < 0 ? ' neg' : '') + '"><span>' + (s < 0 ? 'A devolver pelo colaborador' : 'A pagar ao colaborador') +
      '</span><span class="num">' + fmtBRL(Math.abs(s)) + '</span></div>' +
      '<div class="res-row muted"><span>Fotos de notas no PDF</span><span>' + (m.notas || 0) + '</span></div></div>';
  }
  async function renderAprov() {
    var sec = $('#sec-aprov');
    if (!sec) return;
    sec.hidden = !state.config.aprovador;
    if (sec.hidden) return;
    aprovLista = await carregarAprov();
    aprovLista.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    var box = $('#aprov-lista');
    if (!aprovLista.length) {
      box.innerHTML = '<p class="empty">Os relatórios que você aprovar ou devolver ficam guardados aqui, separados por comercial.</p>';
      return;
    }
    var grupos = {};
    aprovLista.forEach(function (v) { var n = (v.meta && v.meta.nome) || 'Sem nome'; (grupos[n] = grupos[n] || []).push(v); });
    box.innerHTML = Object.keys(grupos).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); }).map(function (n) {
      var g = grupos[n];
      return '<div class="day"><div class="day-h"><span>' + esc(n) + '</span><span>' + g.length + (g.length === 1 ? ' relatório' : ' relatórios') +
        '</span></div><div class="day-box">' + g.map(function (v) {
          var ok = v.status === 'aprovado';
          return '<button class="item" type="button" data-aprov="' + esc(v.id) + '"><span class="item-ico' + (ok ? ' ok' : ' dev') + '">' + svg(ok ? 'check' : 'undo', 18) + '</span>' +
            '<span class="item-txt"><span class="item-cat">' + esc(periodoMeta(v.meta) || 'Relatório') + '</span><span class="item-desc">' +
            (ok ? 'Aprovado em ' : 'Devolvido em ') + esc(v.quando) + '</span></span>' +
            '<span class="item-val"><span class="item-amt">' + esc(fmtBRL(v.meta.total || 0)) + '</span></span></button>';
        }).join('') + '</div></div>';
    }).join('');
  }
  function abrirAprovItem(id) {
    var v = aprovLista.filter(function (x) { return x.id === id; })[0];
    if (!v) return;
    var ok = v.status === 'aprovado';
    openSheet(head('receipt', v.meta.nome || 'Relatório', periodoMeta(v.meta)) + resumoMetaHtml(v.meta) +
      '<p class="callout' + (ok ? '' : ' warn') + '" style="margin-top:12px">' + (ok ? 'Aprovado em ' + esc(v.quando) :
        'Devolvido em ' + esc(v.quando) + (v.motivo ? ': ' + esc(v.motivo) : '')) + '</p>' +
      '<button class="primary" type="button" id="ap-enviar">' + (ok ? 'Enviar ao financeiro' : 'Enviar o PDF de novo') + '</button>' +
      '<div class="actions"><button class="link-danger" type="button" id="ap-apagar">Tirar do histórico</button></div>');
    $('#ap-enviar').addEventListener('click', function () { downloadsLocal.save({ filename: v.arquivo, data: v.pdf }); });
    $('#ap-apagar').addEventListener('click', function () {
      var b = this;
      if (!b.dataset.conf) { b.dataset.conf = '1'; b.textContent = 'Toque de novo para tirar do histórico'; return; }
      idbAprov('readwrite', function (st) { st.delete(v.id); }).then(function () { closeSheet(); renderAprov(); toast('Tirado do histórico'); });
    });
  }
  async function receberPdf(file) {
    var bytes;
    try { bytes = new Uint8Array(await file.arrayBuffer()); } catch (e) { toast('Não consegui abrir esse arquivo'); return; }
    var lido = lerRelatorioPdf(bytes), m = lido.meta;
    if (lido.erro || !m || !m.aprov) {
      openSheet(head('receipt', 'Não dá para aprovar este arquivo', file.name) + '<p class="msg err">' +
        (lido.erro === 'nao-pdf' ? 'Esse arquivo não é um PDF.' : lido.erro ?
          'Esse PDF não foi gerado pelo app de despesas, ou é de uma versão antiga do app. Peça ao comercial para gerar de novo pelo app e enviar o PDF do relatório.' :
          'Esse PDF tem só as fotos das notas. Peça ao comercial o PDF do relatório.') + '</p>');
      return;
    }
    var ja = lido.aprovado, a = state.config.assinatura;
    var primeiro = function (t) { return String(t || '').trim().toLowerCase().split(/\s+/)[0]; };
    openSheet(head('receipt', 'Relatório para aprovar', file.name) + resumoMetaHtml(m) +
      (ja ? '<p class="callout warn" style="margin-top:12px">Este relatório já foi aprovado' + (ja.por ? ' por ' + esc(ja.por) : '') +
        (ja.quando ? ' em ' + esc(ja.quando) : '') + '.</p>' : '') +
      (m.autorizado && primeiro(m.autorizado) !== primeiro(state.config.nome) ?
        '<p class="note">No relatório, quem aprova é: ' + esc(m.autorizado) + '.</p>' : '') +
      (ja ? '' : '<div class="ass"><span class="f-l">Sua assinatura (vai na linha “Aprovação”, com data e hora)</span>' +
        (a ? '<div class="ass-img"><img src="' + esc(a) + '" alt="Sua assinatura"></div>' :
          '<p class="msg err">Desenhe sua assinatura antes de aprovar.</p>') + '</div>') +
      '<div class="gap"></div>' +
      (ja ? '' : a ? '<button class="primary" type="button" id="ap-ok">' + svg('pen', 18) + ' Aprovar e assinar</button>' :
        '<button class="primary" type="button" id="ap-dados">Desenhar minha assinatura</button>') +
      (ja ? '' : '<div class="gap" style="height:10px"></div><button class="secondary" type="button" id="ap-dev">Devolver para ajuste</button>') +
      '<div id="ap-devbox"></div><p class="msg" id="ap-msg" role="status"></p>');
    var dados = $('#ap-dados');
    if (dados) dados.addEventListener('click', function () { closeSheet(); setTimeout(function () { abrirDados(false); }, 260); });
    var okBtn = $('#ap-ok');
    if (okBtn) okBtn.addEventListener('click', async function () {
      var rot = okBtn.innerHTML;
      okBtn.disabled = true; okBtn.textContent = 'Assinando…';
      try {
        var ass = await assinaturaJpeg(state.config.assinatura);
        if (!ass) throw new Error('assinatura');
        var quando = agoraBR();
        var novo = carimbarAprovacao(bytes, lido, ass, state.config.nome || '', quando);
        var nome = file.name.replace(/\.pdf$/i, '').replace(/\s*-\s*APROVADO$/i, '') + ' - APROVADO.pdf';
        var blob = new Blob([novo], { type: 'application/pdf' });
        await idbAprov('readwrite', function (st) {
          st.put({ id: novoIdFoto(), meta: m, status: 'aprovado', quando: quando, ts: Date.now(), arquivo: nome, pdf: blob });
        });
        closeSheet();
        renderAprov();
        toast('Relatório aprovado');
        downloadsLocal.save({ filename: nome, data: blob });
      } catch (e) {
        okBtn.disabled = false; okBtn.innerHTML = rot;
        $('#ap-msg').className = 'msg err';
        $('#ap-msg').textContent = 'Não consegui assinar este PDF. Peça ao comercial para gerar de novo pelo app e enviar sem assinar no gov.br antes.';
      }
    });
    var dev = $('#ap-dev');
    if (dev) dev.addEventListener('click', function () {
      $('#ap-devbox').innerHTML = '<label class="field"><span>O que precisa ajustar?</span>' +
        '<textarea id="ap-motivo" placeholder="Ex.: falta a foto da nota do hotel"></textarea></label>' +
        '<div class="gap" style="height:10px"></div><button class="primary" type="button" id="ap-devok">Enviar devolução</button>';
      $('#ap-motivo').focus();
      $('#ap-devok').addEventListener('click', function () {
        var motivo = $('#ap-motivo').value.trim();
        if (!motivo) { $('#ap-motivo').focus(); return; }
        var quando = agoraBR();
        var texto = 'Relatório de despesas de ' + (m.nome || '') + ' (' + periodoMeta(m) + ', ' + fmtBRL(m.total || 0) +
          ') devolvido para ajuste: ' + motivo;
        var envio = null;
        try { if (navigator.share) envio = navigator.share({ text: texto }).catch(function () {}); } catch (e) { envio = null; }
        if (!envio) { try { navigator.clipboard.writeText(texto); toast('Mensagem copiada. Cole no WhatsApp do comercial.'); } catch (e) { /* sem área de transferência */ } }
        idbAprov('readwrite', function (st) {
          st.put({ id: novoIdFoto(), meta: m, status: 'devolvido', motivo: motivo, quando: quando, ts: Date.now(), arquivo: file.name,
            pdf: new Blob([bytes], { type: 'application/pdf' }) });
        }).then(function () { closeSheet(); renderAprov(); if (envio) toast('Devolução registrada'); });
      });
    });
  }

  // ---------------- Início ----------------
  $('#btn-hist').innerHTML = svg('clock', 20) + '<span>Histórico</span>';
  $('#btn-dados').innerHTML = svg('sliders', 20);
  aplicarTema(temaAtual());
  $('#btn-dados').addEventListener('click', function () { abrirDados(false); });
  $('#btn-receber').addEventListener('click', function () { $('#in-pdf').click(); });
  $('#in-pdf').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) receberPdf(f);
  });
  $('#aprov-lista').addEventListener('click', function (e) { var b = e.target.closest('[data-aprov]'); if (b) abrirAprovItem(b.dataset.aprov); });
  renderAprov();
  renderTiles();
  render();
  $('#tiles').addEventListener('click', function (e) {
    var b = e.target.closest('.tile');
    if (b) abrirLancar({ cat: b.dataset.cat });
  });
  $('#lista').addEventListener('click', function (e) {
    var b = e.target.closest('.item');
    if (b && b.dataset.id) abrirLancar({ editId: b.dataset.id });
  });
  $('#btn-gerar').addEventListener('click', abrirGerar);
  $('#adi').addEventListener('click', function (e) { if (e.target.closest('#btn-adi')) abrirAdiantamento(); });
  $('#btn-hist').addEventListener('click', abrirHistorico);
  ['in-cam', 'in-gal'].forEach(function (idIn) {
    $('#' + idIn).addEventListener('change', async function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      var destino = fotoDestino;
      fotoDestino = null;
      if (!f || !destino) return;
      try { destino(novaFoto(await comprimir(f))); } catch (err) { toast('Não consegui abrir essa foto'); }
    });
  });
  initCloud().then(function () { if (!histRef) usarHistLocal(); }, function () { usarHistLocal(); });
  if (!String(state.config.nome || '').trim()) setTimeout(function () { abrirDados(true); }, 350);
  assetsP.then(function () { render(); });
})();
</script>
